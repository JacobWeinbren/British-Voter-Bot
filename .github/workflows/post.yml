name: Post the next voter card

on:
    # No `schedule:` block on purpose. GitHub's cron used to deliver this workflow reliably - every
    # one of the eight daily ticks landed on 23, 24 and 25 August, 20 to 40 minutes late - and then
    # stopped: 7 of 8 on the 26th with delays stretching to two hours, none at all on the 27th, and
    # 3 of the ~96 ticks asked for over the 28th and 29th. Nothing in the repo explains it. The cron
    # was valid, the workflow was active, the concurrency group had been there since the 22nd through
    # the days that worked, main is the default branch, the repo is public so Actions is unmetered,
    # and github.com reported no incident. Asking for more ticks made it worse, not better: a run
    # still pending when the next tick comes due is dropped, so once GitHub's delay grew past the gap
    # between ticks, going from 8 a day to 48 a day meant almost every one was superseded before it
    # ran. Four hourly ticks in a row went undelivered after that.
    #
    # So the clock now sits outside GitHub: a Cloudflare Worker in trigger/ calls the dispatch API
    # below once an hour (docs/hourly-trigger.md). It knows nothing about slots - `due` still decides
    # whether a card goes out - so a trigger that fires twice or late posts at most one card a slot.
    workflow_dispatch:
        inputs:
            force:
                description: Post the next card even if the latest slot has already been filled
                type: boolean
                default: false

permissions:
    contents: write

concurrency:
    group: post-card
    cancel-in-progress: false

env:
    # The runner's clock is UTC. Without this every local time voterbot computes is an hour behind UK
    # time from late March to late October, so the 10:00 slot is not due until 11:00 UK and the feed
    # drifts by an hour for most of the year. This makes Python's local time UK time.
    TZ: Europe/London

jobs:
    slot:
        runs-on: ubuntu-latest
        outputs:
            go: ${{ steps.due.outputs.go }}
        steps:
            # checkout v5 is the first release built on Node 24. Node 20 is removed from the runner on
            # 16 September 2026, after which a v4 action fails outright rather than warning. Same for
            # setup-python v6 in the job below. Both need runner v2.327.1 or newer, which every
            # GitHub-hosted runner is well past.
            - uses: actions/checkout@v5
              with:
                  # A delayed or queued run checks out the commit that existed when it was triggered, which
                  # can predate the last post's commit. Naming the branch gets the current tip, so `due`
                  # reads the real outputs/last_post.txt instead of a stale one.
                  ref: ${{ github.ref_name }}

            - name: Is a card due?
              id: due
              # `due` needs only the standard library, so the runner's own python3 will do.
              # The handle is read-only here: it names the account whose feed `due` checks before
              # it says yes, so a card that went up but never committed is not posted twice. No
              # app password, and the appview call is unauthenticated.
              env:
                  BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE || vars.BLUESKY_HANDLE }}
              run: |
                  echo "runner local time: $(date -Is)"
                  # Every run reaches this workflow by dispatch now, the hourly trigger included, so
                  # the check has to run by default; `force` is the button for posting a card out of
                  # turn by hand. A boolean input arrives as the string "true".
                  if [ "${{ inputs.force }}" = "true" ]; then
                    echo "forced by hand - posting without checking the slot"
                    echo "go=true" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                  set +e
                  python3 -m voterbot due
                  status=$?
                  set -e
                  case "$status" in
                    0) echo "go=true" >> "$GITHUB_OUTPUT" ;;
                    3) echo "go=false" >> "$GITHUB_OUTPUT" ;;
                    *) echo "::error::voterbot due failed with status $status"; exit "$status" ;;
                  esac

            - name: Commit a repaired ledger
              # `due` rewrites outputs/last_post.txt when the feed shows the slot's card is already
              # up but the queue position never committed. Pushing it here means the next hour reads
              # the repaired time instead of rediscovering the same gap and asking the feed again.
              # Best effort on purpose: the repair is recomputed from the feed every hour, so a push
              # that loses a race costs nothing and must not fail a run that decided correctly.
              run: |
                  if git diff --quiet -- outputs/last_post.txt; then
                    echo "nothing to repair"
                    exit 0
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add -- outputs/last_post.txt
                  git commit -m "Repair the posting ledger"
                  git push || echo "::warning::could not push the repaired ledger - the next check will work it out again"

    post:
        needs: slot
        if: needs.slot.outputs.go == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
              with:
                  ref: ${{ github.ref_name }}
                  # Full history so the rebase below is reliable; rebasing onto a shallow clone is fragile.
                  fetch-depth: 0

            - uses: actions/setup-python@v6
              with:
                  python-version: "3.12"
                  cache: pip

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt
                  python -m playwright install --with-deps chromium

            - name: Render and post
              # Set both under Settings > Secrets and variables > Actions. Either tab works; the app
              # password belongs in Secrets, which GitHub masks in logs (Variables are printed in clear).
              env:
                  BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE || vars.BLUESKY_HANDLE }}
                  BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD || vars.BLUESKY_PASSWORD }}
              run: python -m voterbot post

            - name: Save the queue position and the time of the post
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

                  # -A rather than named paths: a named path that does not exist aborts the whole step.
                  git add -A -- outputs/position.txt outputs/last_post.txt

                  if git diff --cached --quiet; then
                    echo "::warning::the post ran but left no queue position to commit"
                    exit 0
                  fi

                  git commit -m "Advance the posting queue"

                  # The card is already on the feed at this point. If the position never lands, the next run
                  # posts the same card again, so retry and fail loudly rather than swallowing the error.
                  for attempt in 1 2 3; do
                    if git pull --rebase origin "${{ github.ref_name }}" && git push; then
                      exit 0
                    fi
                    echo "push attempt $attempt failed, retrying"
                    sleep 5
                  done

                  echo "::error::posted the card but could not push the queue position"
                  exit 1
