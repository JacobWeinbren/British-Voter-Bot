name: Post the next voter card

on:
  schedule:
    # The feed posts at 10:00, 13:00, 17:00 and 21:00 UK time. GitHub's cron is best effort - runs
    # start late (top-of-the-hour crons by half an hour or more, during an incident by hours) and are
    # sometimes dropped altogether - so the schedule does not try to land on those hours. It runs a
    # cheap check every twenty minutes through the UK day, and the `slot` job posts only when the
    # latest slot has not been posted yet (`python -m voterbot due`, see voterbot/schedule.py). A late
    # run still posts, a dropped run is made up by the next one, and nothing is ever posted twice.
    - cron: "3,23,43 8-23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: post-card
  cancel-in-progress: false

jobs:
  slot:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.due.outputs.go }}
    steps:
      - uses: actions/checkout@v4

      - name: Is a card due?
        id: due
        # `due` needs only the standard library, so the runner's own python3 will do.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run by hand - posting"
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          python3 -m voterbot due
          status=$?
          set -e
          case "$status" in
            0) echo "go=true" >> "$GITHUB_OUTPUT" ;;
            3) echo "go=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::voterbot due failed with status $status"; exit "$status" ;;
          esac

  post:
    needs: slot
    if: needs.slot.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Render and post
        # Set both under Settings > Secrets and variables > Actions. Either tab works; the app
        # password belongs in Secrets, which GitHub masks in logs (Variables are printed in clear).
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE || vars.BLUESKY_HANDLE }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD || vars.BLUESKY_PASSWORD }}
        run: python -m voterbot post

      - name: Save the queue position and the time of the post
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/position.txt outputs/last_post.txt
          git commit -m "Advance the posting queue" || echo "nothing to commit"
          git pull --rebase origin ${{ github.ref_name }}
          git push
